<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梱包ナビ</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--navy:#20447e;--blue:#1c5fc4;--green:#26964b;--yellow:#fff1bc;--red:#c62828;--bg:#f2f5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Hiragino Sans","Meiryo",system-ui,sans-serif;color:#17233c}
header{background:var(--navy);color:#fff;text-align:center;padding:14px;font-size:21px;font-weight:bold;position:sticky;top:0;z-index:10}
main{max-width:1050px;margin:auto;padding:14px 20px 120px}
button{cursor:pointer;border:0;border-radius:10px;font-weight:bold;font-family:inherit}
.scan{width:100%;padding:16px;font-size:18px;background:var(--blue);color:#fff}
.lookup{display:flex;gap:8px;margin-top:10px}
.lookup input{flex:1;min-width:0;padding:13px;font-size:18px;border:1px solid #bbb;border-radius:8px}
.lookup button{padding:0 22px;font-size:17px;background:var(--navy);color:#fff}
#reader{margin-top:10px}
.card{background:#fff;border:1px solid #dce4f0;border-radius:12px;padding:16px 20px;margin:12px 0}
.error{color:var(--red);font-weight:bold}
.tag{display:inline-block;background:#e5eeff;color:var(--navy);border-radius:6px;padding:4px 10px;margin:3px 6px 3px 0;font-size:15px;font-weight:bold}
.tag.method{background:#fde8e8;color:var(--red);border:1px solid #f3b4b4}
/* 進捗 */
.progress{display:flex;align-items:center;gap:4px;overflow-x:auto;white-space:nowrap;margin:10px 0}
.pi{border:1px solid #d0d9e8;border-radius:8px;padding:8px 11px;background:#fff;font-weight:bold;font-size:14px}
.pi.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.pi.done{border-color:var(--green);color:#167a38}
.arrow{color:#8b96a8;font-size:20px}
/* 上部の指示書情報 */
.summary{display:flex;flex-wrap:wrap;gap:6px 26px;align-items:center;font-size:16px}
.summary b{color:#52647c;font-weight:normal;margin-right:6px}
.summary .val{font-weight:bold;font-size:18px}
/* 準備ページ */
.prep-title{font-size:24px;font-weight:bold;margin:6px 0 2px}
.prep-sub{color:#52647c;margin:0 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box h3{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}
.box h3 .icon{font-size:22px}
.casebox{border:3px solid var(--blue)}
.case-list{display:flex;flex-wrap:wrap;gap:10px}
.case{background:#eef4ff;border-radius:10px;padding:10px 16px;text-align:center;min-width:130px}
.case .type{font-size:26px;font-weight:bold;color:var(--navy)}
.case .cnt{font-size:20px;font-weight:bold;color:var(--red)}
.case-none{color:#52647c;font-size:16px}
.warnbox{border:3px solid #e0b100;background:#fffaf0}
.warnbox ul{margin:0;padding-left:22px}
.warnbox li{font-size:17px;line-height:1.6;margin:4px 0}
/* 手順ページ */
.step-title{font-size:24px;font-weight:bold;display:flex;gap:10px;align-items:center}
.num{background:var(--blue);color:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;flex-shrink:0}
.sub{border-top:1px solid #e3e7ee;padding-top:12px;margin-top:12px}
.sub:first-of-type{border-top:0}
.branch{display:inline-block;background:var(--navy);color:#fff;border-radius:5px;padding:3px 10px;font-size:14px}
.explain{font-size:19px;line-height:1.7;margin:10px 0;white-space:pre-wrap}
.warn{background:var(--yellow);border-radius:8px;padding:10px 12px;font-size:17px;white-space:pre-wrap}
.photo{display:block;max-width:440px;max-height:280px;width:auto;margin:12px auto 4px;border-radius:8px;object-fit:contain;cursor:zoom-in}
.hint{text-align:center;font-size:13px;color:#52647c;margin:0}
.missing{color:var(--red);font-size:13px}
.wbar{display:flex;align-items:center;gap:8px;font-size:17px;margin-bottom:10px}
.wbar .reload{margin-left:8px}
.pick-title{font-size:22px;margin:4px 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{background:#fff;border:2px solid #b9c7dc;color:var(--navy);padding:10px 16px;font-size:17px;min-width:64px}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs.big .tab{flex:1 1 150px;padding:22px 10px;font-size:22px}
.lh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.line{border:2px solid #dce4f0;border-radius:10px;margin:8px 0;padding:6px}
.line.on{border-color:var(--blue);background:#f2f7ff}
.line.fin{opacity:.55}
.lbtn{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;background:none;color:#17233c;text-align:left;padding:8px;font-size:17px}
.lno{font-size:21px;font-weight:bold;min-width:90px}
.lbtn .busy{font-size:14px;font-weight:bold}
.tabs.qty{padding:4px 8px 8px}
.selsum{font-size:17px;margin:10px 0 0}
.sleeve{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#e8f1ff;border:3px solid var(--blue);border-radius:10px;padding:12px 16px;margin:12px 0}
.sl-h{font-size:18px;font-weight:bold;color:var(--navy)}
.sl-v{font-size:28px;font-weight:bold;color:var(--blue)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:6px 0;border:2px solid #e0a800;border-radius:8px;background:#fff;font-size:17px;line-height:1.5;cursor:pointer}
.chk input{width:28px;height:28px;flex-shrink:0;accent-color:var(--green)}
.chk.on{border-color:var(--green);background:#e8f5e9}
.warn-h{font-weight:bold;margin-bottom:4px}
.warn{white-space:normal}
.reload{background:#e5eeff;color:var(--navy);padding:6px 12px;font-size:14px}
.lh .reload{margin-left:auto}
.ok{color:var(--green);font-weight:bold}.busy{color:#d07a00}
.need{color:var(--red);font-weight:bold;text-align:center;margin:8px 0 0;min-height:1em}
.res-sub{font-size:18px}.per{font-size:22px}.per b{font-size:44px;color:var(--blue)}
/* 下部ボタン */
.nav{display:flex;gap:14px;position:sticky;bottom:0;background:var(--bg);padding:14px 0}
.nav button{flex:1;padding:18px;font-size:19px;color:#fff;background:var(--green)}
.nav button.back{background:#5a6d86}
.nav button:disabled{opacity:.4}
.finish{text-align:center;padding:40px}
.finish button{background:var(--blue);color:#fff;padding:14px 30px;font-size:17px}
#zoom{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:30}
#zoom img{max-width:95%;max-height:94%}
@media(max-width:700px){
 main{padding:10px 10px 100px}.grid{grid-template-columns:1fr}
 .step-title,.prep-title{font-size:20px}.explain{font-size:17px}
 .photo{max-width:100%;max-height:220px}.nav button{font-size:16px;padding:15px 6px}
 .case .type{font-size:22px}
}
</style>
</head>
<body>
<header>梱包ナビ</header>
<main>
  <div class="wbar">👷 担当：<b id="wname"></b><button class="reload" id="wchange">変更</button></div>
  <div id="top">
    <button class="scan" id="scan">▥ 出荷指示書を読み取る</button>
    <div id="reader"></div>
    <div class="lookup">
      <input id="number" inputmode="numeric" placeholder="指示書番号を入力">
      <button id="lookup">表示</button>
    </div>
  </div>
  <div id="result"></div>
</main>
<div id="zoom"><img alt="拡大写真"></div>
<script>
// ===== Googleスプレッドシート（ウェブに公開したCSV）のURL =====
const ORDERS_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vS-x0hZp_eDL4O40nNsJxQac-69H3PUDNxphv-xR5bT1uG4TaGIg6Db_tXqRSNaA-5zSgeqDq3oXUDW/pub?gid=0&single=true&output=csv";
const STEPS_CSV_URL ="https://docs.google.com/spreadsheets/d/e/2PACX-1vS-x0hZp_eDL4O40nNsJxQac-69H3PUDNxphv-xR5bT1uG4TaGIg6Db_tXqRSNaA-5zSgeqDq3oXUDW/pub?gid=300963233&single=true&output=csv";
const MEMBERS_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vS-x0hZp_eDL4O40nNsJxQac-69H3PUDNxphv-xR5bT1uG4TaGIg6Db_tXqRSNaA-5zSgeqDq3oXUDW/pub?gid=934164460&single=true&output=csv"; // 梱包担当者タブ
const LINES_CSV_URL  ="https://docs.google.com/spreadsheets/d/e/2PACX-1vS-x0hZp_eDL4O40nNsJxQac-69H3PUDNxphv-xR5bT1uG4TaGIg6Db_tXqRSNaA-5zSgeqDq3oXUDW/pub?gid=262134046&single=true&output=csv"; // データタブ
// ===== 作業記録用 Apps Script のウェブアプリ URL =====
const GAS_URL="https://script.google.com/macros/s/AKfycbzY7nZM37Rv0ZC1eQMjneANP7wcMv0h7-T8wGKfJzYZjPQIc-_Ou3JmSg0p8xiykoY9/exec";
let members=[],lineRows=[];
const SHORT={1:"確認",2:"ラベル",3:"ケース",4:"QR照合",5:"緩衝材"};

let orders=[],steps=[],loaded=false,scanner=null;
let order=null,values=[],pages=[],idx=0,done=new Set();
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");const rows=[];let row=[],v="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){v+='"';i++}else q=false}else v+=c}
    else if(c=='"')q=true;else if(c==','){row.push(v);v=""}
    else if(c=='\n'){row.push(v);rows.push(row);row=[];v=""}else if(c!='\r')v+=c}
  if(v||row.length){row.push(v);rows.push(row)}
  const head=(rows.shift()||[]).map(h=>h.trim());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}
async function load(url){const r=await fetch(url+"&_="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);return parseCSV(await r.text())}
function csvRows(text){
  text=text.replace(/^\uFEFF/,"");const rows=[];let row=[],v="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){v+='"';i++}else q=false}else v+=c}
    else if(c=='"')q=true;else if(c==','){row.push(v);v=""}
    else if(c=='\n'){row.push(v);rows.push(row);row=[];v=""}else if(c!='\r')v+=c}
  if(v||row.length){row.push(v);rows.push(row)}return rows}
async function loadText(url){const r=await fetch(url+"&_="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);return r.text()}
async function loadMembers(){try{members=parseCSV(await loadText(MEMBERS_CSV_URL)).map(r=>r["氏名"]).filter(Boolean)}catch(e){members=[]}}
// データタブ：列名で探し、見つからなければ B列・BA列・BE列を使う
async function loadLines(){try{
  const rows=csvRows(await loadText(LINES_CSV_URL)),h=(rows.shift()||[]).map(x=>x.trim());
  const col=(name,def)=>{const i=h.indexOf(name);return i>=0?i:def};
  const cNo=col("出荷指示番号",1),cQty=col("受注数",52),cRow=col("行番",56);
  lineRows=rows.map(r=>({no:String(r[cNo]||"").replace(/\D/g,""),qty:String(r[cQty]||"").replace(/[^\d.]/g,""),row:String(r[cRow]||"").trim()}))
    .filter(r=>r.no&&r.row)}catch(e){lineRows=[]}}
async function init(){
  await loadMembers();showWorker();
  try{[orders,steps]=await Promise.all([load(ORDERS_CSV_URL),load(STEPS_CSV_URL),loadLines()]);loaded=true}
  catch(e){$("result").innerHTML='<p class="error">データを読み込めませんでした。通信状態を確認してください。</p>'}
}
const tokens=s=>String(s||"").split(/[・\n、]/).map(x=>x.trim()).filter(Boolean);
// 条件：共通／「A」／「A／B」(どれか)／「A・B」(すべて)／「○○以外」
function cond(text){text=String(text||"").trim();if(!text||text==="共通")return true;if(text==="該当なし")return false;
  return text.split(/[・＋+]/).every(p=>p.split(/[／\/]/).some(t=>{t=t.trim();return t.endsWith("以外")?!values.includes(t.slice(0,-2)):values.includes(t)}))}
function choose(group){
  let rows=group.filter(r=>r["条件"]!=="該当なし"&&cond(r["条件"]));
  if(!rows.some(r=>r["条件"]&&r["条件"]!=="共通"))rows.push(...group.filter(r=>r["条件"]==="該当なし"));
  const all=rows.filter(r=>(r["表示形式"]||"全表示")!=="優先"),pri=rows.filter(r=>r["表示形式"]==="優先");
  if(pri.length){const m=Math.max(...pri.map(r=>+r["優先度"]||0));all.push(...pri.filter(r=>(+r["優先度"]||0)===m))}
  return all;
}
function imgName(r){let s=(r["画像"]||"").trim();if(!s)return"";if(/^https?:/i.test(s))return s;
  s=s.replace(/\\/g,"/").split("/").pop().trim();return s.replace(/\.(jpe?g|png|gif|webp)$/i,m=>m.toLowerCase())}
// 「G-7×47枚、G-8×47枚」→[{type,count}]
function cases(s){return String(s||"").split(/[、,\n]/).map(x=>x.trim()).filter(Boolean).map(x=>{
  const m=x.match(/^(.+?)\s*[×xX＊*]\s*(\d+)\s*枚?$/);return m?{type:m[1].trim(),count:m[2]+"枚"}:{type:x,count:""}})}

function show(input){
  const n=String(input||"").replace(/\D/g,"");
  if(!loaded){$("result").innerHTML='<p class="error">データ読み込み中です。少し待ってから再度お試しください。</p>';return}
  order=orders.find(r=>String(r["出荷指示番号"]||"").replace(/\D/g,"")===n);
  if(!order){$("result").innerHTML=`<p class="error">指示書番号「${esc(n)}」が見つかりません。番号を確認し、分からない場合は責任者に確認してください。</p><small>（指示書 ${orders.length}件／手順 ${steps.length}件 読み込み済み）</small>`;return}
  order._no=n;values=tokens(order["梱包方法"]);
  const g={};steps.forEach(r=>(g[r["手順番号"]]??=[]).push(r));
  pages=Object.keys(g).sort((a,b)=>a-b).map(k=>({no:k,rows:choose(g[k])})).filter(p=>p.rows.length);
  lines=linesOf(n);sel={};
  idx=-1;done=new Set();checked=new Set();work=null;shared=null;$("top").style.display="none";render();refreshShared();
}

function header(){
  const prog=[`<span class="pi ${idx===-1?"active":""} ${done.has(-1)?"done":""}">0 準備</span>`]
    .concat(pages.map((p,i)=>`<span class="pi ${i===idx?"active":""} ${done.has(i)?"done":""}">${esc(p.no)} ${esc(SHORT[p.no]||p.rows[0]["手順名"])}</span>`))
    .join('<span class="arrow">›</span>');
  return `<div class="card summary">
    <span><b>出荷指示番号</b><span class="val">${esc(order._no)}</span></span>
    ${order["注文主名"]?`<span><b>注文主</b><span class="val">${esc(order["注文主名"])}</span></span>`:""}
    <span><b>数量</b><span class="val">${esc(order["受注数"]||"")}</span></span>
    <span><b>担当</b><span class="val">${esc(worker)}</span></span>
  </div><nav class="progress">${prog}</nav>`;
}

// ===== 担当者（URLを開いたときに1回だけ選択）=====
let worker=localStorage.getItem("worker")||"";
function showWorker(){
  $("wname").textContent=worker||"未選択";
  $("top").style.display=worker?"":"none";
  if(worker)return;
  $("result").innerHTML=`<section class="card"><h2 class="pick-title">👷 担当者を選んでください</h2>
    ${members.length?`<div class="tabs big">${members.map(m=>`<button class="tab" data-m="${esc(m)}">${esc(m)}</button>`).join("")}</div>`
      :`<p class="error">担当者名簿を読み込めませんでした。</p>`}</section>`;
  $("result").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{worker=b.dataset.m;localStorage.setItem("worker",worker);$("result").innerHTML="";showWorker()});
}
function changeWorker(){if(work){alert("作業中は担当者を変更できません。");return}
  worker="";localStorage.removeItem("worker");order=null;showWorker()}

// ===== 行番（データタブ：B 出荷指示番号／BA 受注数／BE 行番）=====
function linesOf(n){
  const m=new Map();
  lineRows.filter(r=>r.no===n).forEach(r=>{const q=+r.qty||0;if(!m.has(r.row)||m.get(r.row)<q)m.set(r.row,q)});
  const a=[...m].map(([row,qty])=>({row,qty})).sort((x,y)=>String(x.row).localeCompare(String(y.row),"ja",{numeric:true}));
  return a.length?a:[{row:"-",qty:+order["受注数"]||1}];
}
// 行番ごとの完了台数・作業中の人
function lineState(row){
  const ws=(shared?.works||[]).filter(w=>String(w.row)===String(row));
  return{done:ws.filter(w=>w.state==="完了").reduce((a,w)=>a+(+w.qty||0),0),
         busy:ws.filter(w=>w.state==="作業中").map(w=>`${w.worker}（${w.qty}台）`)};
}
function linesHtml(){
  return lines.map(l=>{const s=lineState(l.row),rest=Math.max(l.qty-s.done,0),on=sel[l.row]!=null,fin=rest===0;
    return `<div class="line ${on?"on":""} ${fin?"fin":""}">
      <button class="lbtn" data-row="${esc(l.row)}" ${fin||work?"disabled":""}>
        <span class="lno">${on?"☑":"☐"} ${esc(l.row)}</span>
        <span class="lqty">完了 <b>${s.done}</b> / ${l.qty}台</span>
        ${fin?`<span class="ok">✔ 完了</span>`:""}
        ${s.busy.length?`<span class="busy">作業中：${s.busy.map(esc).join("、")}</span>`:""}
      </button>
      ${on?`<div class="tabs qty">${Array.from({length:rest},(_,i)=>i+1).map(q=>`<button class="tab ${sel[l.row]===q?"on":""}" data-row="${esc(l.row)}" data-q="${q}" ${work?"disabled":""}>${q}台</button>`).join("")}</div>`:""}
    </div>`}).join("");
}
function bindLines(){
  $("result").querySelectorAll(".lbtn").forEach(b=>b.onclick=()=>{const r=b.dataset.row,l=lines.find(x=>String(x.row)===r);
    if(sel[r]!=null)delete sel[r];else{const s=lineState(r);
      if(s.busy.length&&!confirm(`${r}行目は ${s.busy.join("、")} が作業中です。選択しますか？`))return;
      sel[r]=Math.max(l.qty-s.done,0)}
    redrawLines()});
  $("result").querySelectorAll(".qty .tab").forEach(b=>b.onclick=()=>{sel[b.dataset.row]=+b.dataset.q;redrawLines()});
}
function redrawLines(){const el=$("lines");if(!el)return;el.innerHTML=linesHtml();bindLines();
  const st=shared&&!shared.error?shared:null,tot=Object.values(sel).reduce((a,b)=>a+b,0);
  $("selsum").innerHTML=`選択中：<b>${Object.keys(sel).length}</b>行　合計 <b>${tot}</b>台`+(st?`　／　指示書の状態：<b class="${st.state==="梱包完了"?"ok":"busy"}">${esc(st.state)}</b>`:"");
  updateNext()}

let checked=new Set(),work=null,shared=null,lines=[],sel={};
const noteItems=s=>String(s||"").split(/\n|・/).map(x=>x.trim()).filter(Boolean);
function checkList(items,key){
  return items.map((t,i)=>{const id=key+":"+i,on=checked.has(id);
    return `<label class="chk ${on?"on":""}"><input type="checkbox" data-id="${esc(id)}" ${on?"checked":""}><span>${esc(t)}</span></label>`}).join("");
}
function allChecked(){return [...$("result").querySelectorAll(".chk input")].every(b=>b.checked)}

async function gasGet(no){const r=await fetch(`${GAS_URL}?no=${encodeURIComponent(no)}&_=${Date.now()}`);return r.json()}
async function gasPost(body){const r=await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});return r.json()}
async function refreshShared(){
  if(!GAS_URL||!order)return;
  try{shared=await gasGet(order._no)}catch(e){shared={error:true}}
  if(idx===-1)redrawLines();
}

function prepPage(){
  const cs=cases(order["ケース必要枚数"]);
  return header()+`
  <p class="prep-title">作業前の準備・確認</p>
  <div class="grid">
    <section class="card box casebox">
      <h3><span class="icon">📦</span>必要なケース</h3>
      ${cs.length?`<div class="case-list">${cs.map(c=>`<div class="case"><div class="type">${esc(c.type)}</div><div class="cnt">${esc(c.count)}</div></div>`).join("")}</div>`
        :`<p class="case-none">指定なし（標準品）</p>`}
    </section>
    <section class="card box">
      <h3><span class="icon">🏷️</span>梱包方法の指定</h3>
      ${values.length?values.map(v=>`<span class="tag method">${esc(v)}</span>`).join(""):`<p class="case-none">指定なし</p>`}
    </section>
  </div>
  <section class="card">
    <h3 class="lh"><span class="icon">🔢</span>担当する行番と台数を選択（複数選択できます）<button class="reload" id="reload">↻ 最新の状況</button></h3>
    ${GAS_URL?"":`<p class="case-none">※記録先が未設定のため、作業記録は保存されません。</p>`}
    ${shared?.error?`<p class="error">他の人の作業状況を取得できませんでした。</p>`:""}
    <div id="lines">${linesHtml()}</div>
    <p class="selsum" id="selsum"></p>
  </section>
  <p class="need" id="need"></p>
  <div class="nav"><button class="back" id="prev">← 番号入力に戻る</button><button id="next">作業開始　手順1へ →</button></div>`;
}

function stepPage(){
  const p=pages[idx],last=idx===pages.length-1;
  let h=header()+`<section class="card"><div class="step-title"><span class="num">${esc(p.no)}</span>手順 ${idx+1}／${pages.length}　${esc(p.rows[0]["手順名"])}</div>`;
  // スリーブ必要数は手順2のときだけ表示
  const sv=String(order["スリーブ必要数"]||"").trim();
  if(String(p.no)==="2"&&sv)h+=`<div class="sleeve"><span class="sl-h">🧤 スリーブ必要数</span><span class="sl-v">${esc(sv)}</span></div>`;
  p.rows.forEach((r,ri)=>{const im=imgName(r),ns=noteItems(r["注意"]);
    h+=`<div class="sub">${r["分岐"]&&r["分岐"]!=="共通"?`<span class="branch">${esc(r["分岐"])}</span>`:""}
      <div class="explain">${esc(r["説明"])}</div>
      ${ns.length?`<div class="warn"><div class="warn-h">⚠ 注意（タップしてチェック）</div>${checkList(ns,"s"+idx+"-"+ri)}</div>`:""}
      ${im?`<img class="photo" src="${esc(im)}" data-name="${esc(im)}" alt="手順写真"><p class="hint">写真をタップして拡大</p>`:""}</div>`});
  return h+`</section><p class="need" id="need"></p><div class="nav"><button class="back" id="prev">← 前の手順</button><button id="next">${last?"✔ 梱包完了":"完了して次へ →"}</button></div>`;
}

function updateNext(){
  const nx=$("next");if(!nx)return;
  let msg="";
  if(idx===-1&&!work&&!Object.values(sel).some(q=>q>0))msg="担当する行番と台数を選択してください。";
  else if(!allChecked())msg="注意事項をすべてチェックすると次へ進めます。";
  nx.disabled=!!msg;$("need").textContent=msg;
}

async function startWork(){
  const ls=Object.entries(sel).filter(([,q])=>q>0).map(([row,qty])=>({row,qty}));
  const qty=ls.reduce((a,l)=>a+l.qty,0);
  work={worker,lines:ls,qty,start:Date.now(),id:null};
  if(GAS_URL){
    try{const r=await gasPost({action:"start",no:order._no,total:order["受注数"]||"",lines:ls,worker});work.id=r.id}
    catch(e){alert("作業開始を記録できませんでした。通信状態を確認してください。（作業はこのまま続けられます）")}
  }
  return true;
}

async function finishWork(){
  const out=$("result");
  out.innerHTML=`<section class="card finish"><h2>記録中…</h2></section>`;
  let min=Math.round((Date.now()-work.start)/6000)/10,qty=work.qty||1,st=null,saved=false;
  if(GAS_URL&&work.id){
    try{const r=await gasPost({action:"finish",id:work.id});if(r.ok){min=r.minutes;st=r.status;saved=true}}catch(e){}
  }
  const per=Math.round(min/qty*10)/10;
  out.innerHTML=`<section class="card finish">
    <h2>✔ 梱包お疲れさまでした</h2>
    <p class="res-sub">${work.lines.map(l=>`${esc(l.row)}行目×${l.qty}台`).join("、")}</p>
    <p class="res-sub">合計 ${esc(qty)}台　／　作業時間 ${esc(min)}分</p>
    <p class="per">1台あたり <b>${esc(per)}</b> 分</p>
    ${st?`<p>指示書の状態：<b class="${st.state==="梱包完了"?"ok":"busy"}">${esc(st.state)}</b>（完了 ${esc(st.done)} / ${esc(st.total)}台）</p>`:""}
    <p style="color:#52647c;font-size:14px">${saved?"※作業記録を保存しました。":"※作業記録は保存されていません。"}</p>
    <button id="restart">次の指示書を読み取る</button></section>`;
  $("restart").onclick=reset;work=null;
}

function render(){
  const out=$("result");out.innerHTML=idx===-1?prepPage():stepPage();window.scrollTo(0,0);
  out.querySelectorAll("img.photo").forEach(im=>{
    im.onerror=()=>{const d=document.createElement("p");d.className="missing";d.textContent="写真が見つかりません："+im.dataset.name;im.nextElementSibling?.remove();im.replaceWith(d)};
    im.onclick=()=>{$("zoom").querySelector("img").src=im.src;$("zoom").style.display="flex"}});
  out.querySelectorAll(".chk input").forEach(b=>b.onchange=()=>{
    b.checked?checked.add(b.dataset.id):checked.delete(b.dataset.id);
    b.parentElement.classList.toggle("on",b.checked);updateNext()});
  if($("reload"))$("reload").onclick=refreshShared;
  if(idx===-1)redrawLines();
  updateNext();
  $("prev").onclick=()=>{if(idx===-1){if(work&&!confirm("作業を中止して番号入力に戻りますか？"))return;reset()}else{idx--;render()}};
  $("next").onclick=async()=>{
    if($("next").disabled)return;
    if(idx===-1&&!work){$("next").disabled=true;await startWork()}
    done.add(idx);
    if(idx<pages.length-1){idx++;render()}else finishWork()};
}
function reset(){$("result").innerHTML="";$("number").value="";$("top").style.display="";order=null;work=null;shared=null;sel={};checked=new Set();window.scrollTo(0,0)}

$("lookup").onclick=()=>show($("number").value);
$("number").onkeydown=e=>{if(e.key==="Enter")show(e.target.value)};
$("wchange").onclick=changeWorker;
$("zoom").onclick=()=>$("zoom").style.display="none";
$("scan").onclick=async()=>{
  if(scanner){await scanner.stop().catch(()=>{});scanner=null;$("reader").innerHTML="";return}
  if(typeof Html5Qrcode==="undefined"){alert("読み取り機能を読み込めません。通信を確認してください。");return}
  scanner=new Html5Qrcode("reader");
  try{await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:280,height:120}},async t=>{
    await scanner.stop();scanner=null;$("reader").innerHTML="";$("number").value=t;show(t)})}
  catch(e){scanner=null;alert("カメラを起動できません。カメラの許可を確認してください。")}
};
init();
</script>
</body>
</html>
